[package]
name = "postflow-desktop"
version = "0.1.0"
description = "PostFlow desktop shell and backend supervisor"
authors = ["PostFlow Team"]
edition = "2021"

[lib]
name = "postflow_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
